    authDomain: "unworldcup.firebaseapp.com",
    databaseURL: "https://unworldcup-default-rtdb.firebaseio.com",

    messagingSenderId: "666050004526",

  };
  firebase.initializeApp(firebaseConfig);
  const _fbDb  = firebase.database();
  const _fbRef = _fbDb.ref('league');

  // Listen for remote changes — guarded so it only fires after main script is ready
  _fbRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) return;
    if (typeof window.state === 'undefined') return; // main script not ready yet
    window.state = data;
    if (!window.state.draftedBy) window.state.draftedBy = {};
    if (!window.state.games)     window.state.games     = [];
    if (!window.state.teams)     window.state.teams     = [];
    if (!window.state.players)   window.state.players   = [];
    if (!window.state.stats)     window.state.stats     = [];
    if (!window.state.roundNum)  window.state.roundNum  = 0;
    if (typeof window.render === 'function') window.render();
  });

  // Save to Firebase — compat SDK accepts arrays fine
  window._fbSave = function(stateObj) {
    _fbRef.set(stateObj).catch(e => console.warn('Firebase save error:', e));
  };
</script>

<script>
const STORAGE_KEY = 'unworldcup_v1';
const COLORS = ['#ff4444','#ff8844','#ffcc44','#44ff88','#44ccff','#8844ff','#ff44cc','#e8e8e8','#888888'];
const ROSTER_SLOTS = {attacker:2, midfielder:2, defender:2, goalie:1};

const WASTELAND = ["April is the cruellest month, breeding lilacs out of the dead land.","I will show you fear in a handful of dust.","The river's tent is broken; the last fingers of leaf clutch and sink into the wet bank.","What are the roots that clutch, what branches grow out of this stony rubbish?","Here is no water but only rock, rock and no water and the sandy road.","I think we are in rats' alley where the dead men lost their bones.","The awful daring of a moment's surrender.","These fragments I have shored against my ruins.","Who is the third who walks always beside you?","Unreal city, under the brown fog of a winter dawn.","The wind crosses the brown land, unheard.","At the violet hour, when the eyes and back turn upward from the desk.","The nymphs are departed.","Son of man, you cannot say, or guess, for you know only a heap of broken images.","I had not thought death had undone so many.","There I saw one I knew, and stopped him, crying: you who were with me in the ships at Mylae.","What have we given? My friend, blood shaking my heart.","Sweet Thames, run softly, till I end my song.","By the waters of Leman I sat down and wept.","O the moon shone bright on Mrs. Porter and on her daughter."];

const OMINOUS = ["The scoreboard does not lie, though the scoreboard itself has lied before.","Witnesses report the grass did not grow back for three days.","Officials declined to comment on what the linesperson saw.","The stadium clocks ran backwards for approximately eleven minutes.","All post-match interviews were conducted in a room that had no door.","The referee has not been seen since.","The ball, when recovered, was warm.","Meteorologists are not returning calls.","Something was decided here today. What, exactly, remains contested.","Players from both sides later agreed: the shadows had been wrong.","Three spectators in row G reported briefly forgetting their own names.","The away team bus arrived. The away team had not been on it.","One corner flag remained upright. No one touched it.","The goal was given. The goal was also not given. Both are true.","Investigators later confirmed the pitch was exactly one metre longer than it had been before kickoff."];

const VERBS_ATK = ['struck','dispatched','detonated','manifested','willed into existence','deposited','conjured','forced through the membrane of possibility','launched into the void','inscribed upon the net','Scithed into the top corner','Absolutely twatted in'];
const VERBS_GK  = ['refused entry to','dissolved','returned to the nothing from which it came','unmade','held at the threshold','consumed','quietly reclassified as not having occurred','denied passage to','Ate'];
const verbs_Def = ['fucking nutted','deleted from the world','blocked','refused to block','dedended','stopped','angered','bled out'];
const VERBS_MID = ['controlled the space around','imposed order upon','redistributed the chaos near','threaded through','quietly dominated','refused to yield ground to','made themselves very large near','narrated proceedings from the centre against','betrayed a certain animalistic fury'];

function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function roll(p){ return Math.random() < p; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr; }

function generateReport(game) {
  const hR = Object.entries(state.draftedBy).filter(([pid,tid])=>tid===game.homeId).map(([pid])=>state.players.find(p=>p.id===pid)).filter(Boolean);
  const aR = Object.entries(state.draftedBy).filter(([pid,tid])=>tid===game.awayId).map(([pid])=>state.players.find(p=>p.id===pid)).filter(Boolean);
  const all = [...hR,...aR];

  const hAtk = hR.filter(p=>p.pos==='attacker');
  const aAtk = aR.filter(p=>p.pos==='attacker');
  const hDef = hR.filter(p=>p.pos==='defender');
  const aDef = aR.filter(p=>p.pos==='defender');
  const hMid = hR.filter(p=>p.pos==='midfielder');
  const aMid = aR.filter(p=>p.pos==='midfielder');
  const hGk  = hR.filter(p=>p.pos==='goalie');
  const aGk  = aR.filter(p=>p.pos==='goalie');
  const min  = () => Math.floor(Math.random()*85)+5;

  // ── attacker pool ────────────────────────────────────────────────────────
  const atkPool = [];
  if (hAtk.length && aGk.length)
    atkPool.push(`${rnd(hAtk).name} ${rnd(VERBS_ATK)} a goal in the ${min()}th minute; ${rnd(aGk).name} ${rnd(VERBS_GK)} two subsequent attempts before the ground shifted.`);
  if (hAtk.length && aGk.length)
    atkPool.push(`${rnd(hAtk).name} ${rnd(VERBS_ATK)} in the ${min()}th. ${rnd(aGk).name} ${rnd(VERBS_GK)} everything that followed.`);
  if (hAtk.length)
    atkPool.push(`${rnd(hAtk).name} ${rnd(VERBS_ATK)} the only goal of the half, which officials later described as "probable".`);
  if (hAtk.length)
    atkPool.push(`${rnd(hAtk).name} ${rnd(VERBS_ATK)} twice. Both are listed in the match report under different categories.`);
  if (aAtk.length && hGk.length)
    atkPool.push(`${rnd(aAtk).name} ${rnd(VERBS_ATK)} from range in the ${min()}th; ${rnd(hGk).name} ${rnd(VERBS_GK)} the follow-up.`);
  if (aAtk.length)
    atkPool.push(`${rnd(aAtk).name} ${rnd(VERBS_ATK)} an attempt that was ruled ${roll(0.5)?'valid':'inconclusive'}.`);
  if (aAtk.length && hGk.length)
    atkPool.push(`${rnd(aAtk).name} bore down on goal; ${rnd(hGk).name} ${rnd(VERBS_GK)} the attempt and stood very still afterwards.`);
  if (hAtk.length && aAtk.length)
    atkPool.push(`${rnd(hAtk).name} and ${rnd(aAtk).name} each had efforts in the ${min()}th. One was counted. The other was not addressed.`);
  if (!atkPool.length)
    atkPool.push(`The match proceeded. Causality was maintained, more or less.`);

  // ── defender pool ────────────────────────────────────────────────────────
  const defPool = [];
  if (aDef.length && hAtk.length)
    defPool.push(`${rnd(aDef).name} ${rnd(verbs_Def)} ${rnd(hAtk).name} in the ${min()}th, which briefly altered the shape of the game.`);
  if (aDef.length)
    defPool.push(`${rnd(aDef).name} ${rnd(verbs_Def)} an advance that had seemed, until that point, unstoppable.`);
  if (hDef.length && aAtk.length)
    defPool.push(`${rnd(hDef).name} ${rnd(verbs_Def)} ${rnd(aAtk).name} in the ${min()}th. The attempt was not spoken of again.`);
  if (hDef.length)
    defPool.push(`${rnd(hDef).name} ${rnd(verbs_Def)} the approach entirely. The approach has not commented.`);
  if (hDef.length && aAtk.length)
    defPool.push(`${rnd(aAtk).name} was ${rnd(verbs_Def)} by ${rnd(hDef).name} before reaching the area. What happened in that corridor of grass has not been fully established.`);
  if (aDef.length && hDef.length)
    defPool.push(`${rnd(aDef).name} and ${rnd(hDef).name} contested the edge of the area. Neither has described the experience publicly.`);
  if (aGk.length)
    defPool.push(`${rnd(aGk).name} ${rnd(VERBS_GK)} three attempts in the ${min()}th minute alone.`);
  if (hGk.length)
    defPool.push(`${rnd(hGk).name} ${rnd(VERBS_GK)} what would have been the equaliser. The crowd did not react immediately.`);

  // ── midfielder pool ──────────────────────────────────────────────────────
  const midPool = [];
  if (hMid.length)
    midPool.push(`${rnd(hMid).name} ${rnd(VERBS_MID)} the opposing midfield for a period officials estimated at most of the second half.`);
  if (aMid.length)
    midPool.push(`${rnd(aMid).name} ${rnd(VERBS_MID)} the centre before being replaced by something less legible.`);
  if (hMid.length && aMid.length)
    midPool.push(`${rnd(hMid).name} and ${rnd(aMid).name} ${rnd(VERBS_MID)} each other for the duration. Neither has described the experience publicly.`);
  if (hMid.length)
    midPool.push(`${rnd(hMid).name} ${rnd(VERBS_MID)} the lines, creating three chances each ruled to have occurred at the wrong time.`);
  if (aMid.length && hAtk.length)
    midPool.push(`${rnd(aMid).name} ${rnd(VERBS_MID)} the supply to ${rnd(hAtk).name} for long stretches of the second half.`);
  if (hMid.length && aDef.length)
    midPool.push(`${rnd(hMid).name} ${rnd(VERBS_MID)} the defensive shape of ${rnd(aDef).name} in the ${min()}th. Something shifted.`);

  // ── atmospheric pool ─────────────────────────────────────────────────────
  const atmPool = [
    `The match was played at the correct time. This was later noted as unusual.`,
    `The match was played thirty minutes early. This was described by all involved as most excellent.`,
    `A penalty was not awarded. Whether one should have been remains, officially, an open question.`,
    `The referee added four minutes of stoppage time and then, without explanation, subtracted two.`,
    `An injury was treated on the pitch for six minutes. The player involved returned and was not thereafter visible.`,
    `The corner flags were replaced at half time. The original flags were not recovered.`,
    `The ball spent eleven minutes in the air during the second half. This is not a record but it is close.`,
    `Both teams wore their correct kits. This was confirmed afterwards by a third party.`,
    `A substitution was made in the ${min()}th minute that no one on either bench appeared to authorise.`,
    `The home coach had not moved from the technical area since the 12th minute and did not appear to be breathing.`,
    `The away manager was seen consulting a document during the second half. The document appeared to be blank.`,
    `Neither coach made a substitution. Sources close to the bench say neither coach acknowledged the option existed.`,
    `A figure in a long coat occupied the away dugout for the final twenty minutes. The club has not confirmed who this was.`,
    `The home manager, when asked about the result post-match, said only: "I do not belive in your reality scum."`,
    `Attendance was recorded as either four thousand or one. The discrepancy has not been explained.`,
    `The away supporters sang a song that witnesses describe as "familiar, but wrong."`,
    `Row J was empty at kickoff. By half time it was full. No one in row J has been interviewed.`,
    `Someone in the crowd mumbled all of the events in match three seconds before they happened under his breath. This was noted and not followed up.`,
    `The stadium announcer mispronounced every name.`,
    `The fourth official's notes were later found to be written in a language no one recognised.`,
    `The tunnel was longer after the match than it had been before.`,
    `Celeberities attending the match include, Anne Hathaway, Tom Hiddelston, and Ghengis Khan.`,

  ];

  const potmIntros = ['Player of the match, by general and uncomfortable consensus, was','Officials later designated the standout performance as belonging to','Those keeping records noted one name above all others:','Whatever happened here, it happened most noticeably around','If one player was to be held responsible for the shape of this result, sources suggest it was'];
  const potmOutros = ['who declined to be interviewed.','who was not available for comment and has not been since.','whose post-match remarks were described as "consistent with someone who had played."','who left the pitch at the final whistle without looking back.','who was seen afterwards sitting alone in the car park for an indeterminate period.','who, when asked to describe the game, said it had occurred.','who smiled in a way that did not reach anywhere.','whose boots, recovered from the changing room, were facing the wrong direction.'];

  // ── assemble ─────────────────────────────────────────────────────────────
  const parts = [];

  if (atkPool.length && roll(0.80)) parts.push(rnd(atkPool));
  if (defPool.length && roll(0.65)) parts.push(rnd(defPool));
  if (midPool.length && roll(0.60)) parts.push(rnd(midPool));
  if (parts.length === 0 && all.length) parts.push(`${rnd(all).name} was present for the duration and has been noted as such.`);

  if (all.length && roll(0.55)) parts.push(`${rnd(potmIntros)} ${rnd(all).name}, ${rnd(potmOutros)}`);
  if (roll(0.50)) parts.push(rnd(atmPool));
  if (roll(0.25)) parts.push(rnd(atmPool));
  if (roll(0.70)) parts.push(`"${rnd(WASTELAND)}"`);

  // shuffle everything, then conditionally append OMINOUS last at 30%
  shuffle(parts);
  if (roll(0.30)) parts.push(rnd(OMINOUS));

  return parts.join(' ');
}

function makePlayers() {
  return RAW.map((r,i) => ({id:'p'+(i+1), name:r[0], pos:r[1], spd:r[2], str:r[3], def:r[4], vis:r[5], stm:r[6]}));
}

function _defaultStats() {
  return [
    {id:'spd',name:'speed',weight:1},
    {id:'str',name:'Holiness',weight:4},
    {id:'def',name:'zest',weight:2},
    {id:'vis',name:'vision',weight:3},
    {id:'stm',name:'Hustle',weight:2},
  ];
}
window._defaultStats = _defaultStats;

const DEFAULT_STATE = {
  leagueName: 'the unworld cup',
  stats: _defaultStats(),
  players: makePlayers(),
  teams: [],
  games: [],
  draftedBy: {},
  roundNum: 0,
};

let state = {};
let playerFilter = 'all';
let draftFilter  = 'all';
// expose for Firebase callback
Object.defineProperty(window, 'state', { get: () => state, set: v => { state = v; } });

function loadState() {
  // Try localStorage first (fallback / offline)
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
      // Only seed players if there are genuinely none saved — never overwrite custom edits
      if (!state.players || state.players.length === 0) state.players = makePlayers();
      if (!state.draftedBy) state.draftedBy = {};
      if (!state.games) state.games = [];
      if (!state.teams) state.teams = [];
      if (!state.stats) state.stats = _defaultStats();
      if (!state.roundNum) state.roundNum = 0;
    } else {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  } catch(e) {
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}

function saveState() {
  // Save to localStorage always (instant, offline-safe)
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  // Save to Firebase if available
  if (typeof window._fbSave === 'function') {
    window._fbSave(state);
  }
}

// localStorage polling — fallback for same-device multi-tab when Firebase unavailable
setInterval(() => {
  if (window._fbSave) return; // Firebase handles live sync
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { state = JSON.parse(raw); render(); }
  } catch(e) {}
}, 50000);

function calcScore(p) {
  const total = state.stats.reduce((a,b)=>a+b.weight,0) || 1;
  return Math.round(state.stats.reduce((a,s)=>a+(p[s.id]||0)*s.weight,0) / total);
}
function stars(sc) { const n=Math.round((sc/100)*5); return '★'.repeat(Math.max(1,n))+'☆'.repeat(5-Math.max(1,n)); }
function posClass(pos) { return pos==='attacker'?'pos-atk':pos==='midfielder'?'pos-mid':pos==='defender'?'pos-def':'pos-gk'; }

function rosterCountsFor(teamId) {
  const c = {attacker:0, midfielder:0, defender:0, goalie:0};
  Object.entries(state.draftedBy).filter(([pid,tid])=>tid===teamId).forEach(([pid]) => {
    const p = state.players.find(pl=>pl.id===pid);
    if (p && c[p.pos] !== undefined) c[p.pos]++;
  });
  return c;
}
function canDraft(teamId, pos) {
  return rosterCountsFor(teamId)[pos] < (ROSTER_SLOTS[pos]||0);
}

function render() {
  updateTicker();
  renderPlayers();
  renderDraft();
  renderTeams();
  renderLeague();
  renderStandings();
  renderOwner();
  const t = document.getElementById('leagueTitle');
  if (t) {
    const p = (state.leagueName||'the unworld cup').split(' ');
    t.innerHTML = p[0] + ' <span>' + p.slice(1).join(' ') + '</span>';
  }
}
window.render = render; // expose for Firebase callback

function updateTicker() {
  const el = document.getElementById('ticker'); if (!el) return;
  const atk = state.players.filter(p=>p.pos==='attacker').length;
  const mid = state.players.filter(p=>p.pos==='midfielder').length;
  const def = state.players.filter(p=>p.pos==='defender').length;
  const gk = state.players.filter(p=>p.pos==='goalie').length;
  const fb = window._fbSave ? ' // firebase: live' : ' // offline mode';
  el.textContent = `// ${state.players.length} players (${atk} atk / ${mid} mid / ${def} def / ${gk} gk) // ${state.teams.length} teams // ${state.leagueName||'unworld cup'}${fb}`;
}

function filterPlayers(f, btn) {
  playerFilter = f;
  document.querySelectorAll('#tab-players .fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPlayers();
}

function filterDraft(f, btn) {
  draftFilter = f;
  document.querySelectorAll('#draftFilterBar .fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDraft();
}

function renderPlayers() {
  const g = document.getElementById('playerGrid'); if (!g) return;
  g.innerHTML = '';
  const list = playerFilter==='all' ? state.players : state.players.filter(p=>p.pos===playerFilter);
  list.forEach(p => {
    const sc = calcScore(p);
    const tid = state.draftedBy[p.id];
    const tm = tid ? state.teams.find(t=>t.id===tid) : null;
    const el = document.createElement('div');
    el.className = 'pc';
    el.innerHTML = `<div class="psc">${sc}</div><div class="pn">${p.name}</div><div class="pp"><span class="${posClass(p.pos)}">${p.pos}</span>${tm ? ' // <span style="color:var(--fg3)">'+tm.name+'</span>' : ''}</div><div class="pst">${stars(sc)}</div>${state.stats.map(s=>`<div class="sr"><span>${s.name}</span><span class="sv">${p[s.id]||0}</span></div>`).join('')}`;
    g.appendChild(el);
  });
}

function renderDraft() {
  const top = document.getElementById('draftTop');
  const g = document.getElementById('draftGrid');
  if (!top || !g) return;

  // Check if user has a team stored in sessionStorage
  const myTeamId = sessionStorage.getItem('uwc_myteam');
  const myTeam = myTeamId ? state.teams.find(t=>t.id===myTeamId) : null;

  if (!myTeam) {
    top.innerHTML = `<div class="notice" style="margin-bottom:12px">select your team to draft players</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:14px">
        ${state.teams.length ? state.teams.map(t=>{
          const counts = rosterCountsFor(t.id);
          const total = Object.values(counts).reduce((a,b)=>a+b,0);
          return `<div class="team-list-card" style="cursor:pointer;flex-direction:column;align-items:flex-start" onclick="claimTeam('${t.id}')">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              ${(t.colors||['#888']).map(c=>`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c}"></span>`).join('')}
              <span style="font-weight:700">${t.name}</span>
            </div>
            <div style="font-size:10px;color:var(--fg3)">${total}/7 players drafted</div>
          </div>`;
        }).join('') : '<div class="notice" style="grid-column:1/-1">no teams yet — create one in the teams tab</div>'}
      </div>`;
    g.innerHTML = '';
    return;
  }

  const counts = rosterCountsFor(myTeam.id);
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  top.innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
    <span class="pill live">managing: ${myTeam.name}</span>
    <span style="color:var(--fg2);font-size:11px">roster: ${total}/7 &nbsp;|&nbsp; <span class="pos-atk">atk ${counts.attacker}/2</span> &nbsp;<span class="pos-mid">mid ${counts.midfielder}/2</span> &nbsp;<span class="pos-def">def ${counts.defender}/2</span> &nbsp;<span class="pos-gk">gk ${counts.goalie}/1</span></span>
    <button style="margin-left:auto;padding:4px 10px;font-size:10px" onclick="sessionStorage.removeItem('uwc_myteam');renderDraft()">switch team</button>
  </div>`;

  g.innerHTML = '';
  const drafted = new Set(Object.keys(state.draftedBy));
  const list = draftFilter==='all' ? state.players : state.players.filter(p=>p.pos===draftFilter);

  // Only show undrafted players, or players on this team
  list.filter(p => !drafted.has(p.id) || state.draftedBy[p.id]===myTeam.id).forEach(p => {
    const mine = state.draftedBy[p.id] === myTeam.id;
    const sc = calcScore(p);
    const slotFull = !canDraft(myTeam.id, p.pos);
    const el = document.createElement('div');
    el.className = 'pc' + (mine ? ' sel' : '');
    let btn = '';
    if (mine) btn = `<button class="danger" style="margin-top:8px;width:100%" onclick="undraft('${p.id}')">release</button>`;
    else if (!slotFull) btn = `<button class="good" style="margin-top:8px;width:100%" onclick="draft('${p.id}')">draft</button>`;
    else btn = `<div class="pill w" style="margin-top:8px">${p.pos} full</div>`;
    el.innerHTML = `<div class="psc">${sc}</div><div class="pn">${p.name}</div><div class="pp"><span class="${posClass(p.pos)}">${p.pos}</span></div><div class="pst">${stars(sc)}</div>${state.stats.map(s=>`<div class="sr"><span>${s.name}</span><span class="sv">${p[s.id]||0}</span></div>`).join('')}${btn}`;
    g.appendChild(el);
  });
  if (!g.children.length) g.innerHTML = '<div class="notice" style="grid-column:1/-1">all available players drafted</div>';
}

function claimTeam(id) {
  sessionStorage.setItem('uwc_myteam', id);
  renderDraft();
}

function draft(pid) {
  const myTeamId = sessionStorage.getItem('uwc_myteam');
  const myTeam = myTeamId ? state.teams.find(t=>t.id===myTeamId) : null;
  if (!myTeam) return;
  const p = state.players.find(pl=>pl.id===pid); if (!p) return;
  if (!canDraft(myTeam.id, p.pos)) return;
  state.draftedBy[pid] = myTeam.id;
  saveState(); renderDraft(); renderPlayers();
}

function undraft(pid) {
  delete state.draftedBy[pid];
  saveState(); renderDraft(); renderPlayers();
}

function renderTeams() {
  const sec = document.getElementById('teamsSection'); if (!sec) return;
  const myTeamId = sessionStorage.getItem('uwc_myteam');

  let html = `<button class="bigbtn" style="margin-bottom:16px" onclick="showCreateTeam()">+ create new team</button>`;

  if (!state.teams.length) {
    html += '<div class="notice">no teams yet — be the first</div>';
  } else {
    state.teams.forEach(t => {
      const roster = Object.entries(state.draftedBy).filter(([pid,tid])=>tid===t.id).map(([pid])=>state.players.find(p=>p.id===pid)).filter(Boolean);
      const atk = roster.filter(p=>p.pos==='attacker');
      const mid = roster.filter(p=>p.pos==='midfielder');
      const def = roster.filter(p=>p.pos==='defender');
      const gk = roster.filter(p=>p.pos==='goalie');
      const dots = (t.colors||['#888']).map(c=>`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:3px"></span>`).join('');
      const isMine = myTeamId === t.id;

      function rosterSection(players, max, label, cls) {
        let out = `<div style="margin-bottom:10px"><div class="slot-label ${cls}">${label} (${players.length}/${max})</div><div class="slot-grid${max===1?' one':''}">`;
        for (let i=0;i<max;i++) {
          if (players[i]) {
            out += `<div class="slot-card"><div><div style="font-size:12px;font-weight:700">${players[i].name}</div><div style="font-size:10px;color:var(--warn)">${stars(calcScore(players[i]))}</div></div></div>`;
          } else {
            out += `<div class="slot-empty">empty</div>`;
          }
        }
        out += '</div></div>';
        return out;
      }

      html += `<div class="card" style="border-color:${isMine?'#555':''}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          ${dots}<div style="font-size:16px;font-weight:700">${t.name}</div>
          ${isMine ? '<span class="pill live" style="margin-left:auto">your team</span>' : ''}
        </div>
        ${t.motto ? `<div style="font-size:11px;color:var(--fg3);margin-bottom:12px;font-style:italic">"${t.motto}"</div>` : ''}
        ${rosterSection(atk,2,'attackers','atk')}
        ${rosterSection(mid,2,'midfielders','mid')}
        ${rosterSection(def,2,'defenders','def')}
        ${rosterSection(gk,1,'goalie','gk')}
        <div class="brow">
          ${isMine ? `<button class="primary" onclick="showEditTeam('${t.id}')">edit team</button>` : `<button onclick="claimTeamAndGoDraft('${t.id}')">manage roster</button>`}
        </div>
      </div>`;
    });
  }
  sec.innerHTML = html;
}

function claimTeamAndGoDraft(id) {
  sessionStorage.setItem('uwc_myteam', id);
  switchTab('draft');
}

// track which rounds are collapsed (collapsed by default after round 1)
const collapsedRounds = new Set();

function toggleRound(r) {
  if (collapsedRounds.has(r)) collapsedRounds.delete(r);
  else collapsedRounds.add(r);
  renderLeague();
}

function renderLeague() {
  const h2h = document.getElementById('h2hGrid');
  const fl = document.getElementById('fixtureLog');
  if (!h2h || !fl) return;
  const teams = state.teams;
  if (teams.length < 2) { h2h.innerHTML='<div class="notice">need 2+ teams</div>'; fl.innerHTML=''; return; }

  const results = {};
  teams.forEach(t => results[t.id] = {});
  (state.games||[]).forEach(g => {
    if (!results[g.homeId] || !results[g.awayId]) return;
    if (!results[g.homeId][g.awayId]) results[g.homeId][g.awayId] = {w:0,l:0,d:0,last:null};
    if (!results[g.awayId][g.homeId]) results[g.awayId][g.homeId] = {w:0,l:0,d:0,last:null};
    const hW = g.homeScore > g.awayScore, aW = g.awayScore > g.homeScore;
    if (hW) { results[g.homeId][g.awayId].w++; results[g.awayId][g.homeId].l++; }
    else if (aW) { results[g.homeId][g.awayId].l++; results[g.awayId][g.homeId].w++; }
    else { results[g.homeId][g.awayId].d++; results[g.awayId][g.homeId].d++; }
    results[g.homeId][g.awayId].last = `${g.homeScore}-${g.awayScore}`;
    results[g.awayId][g.homeId].last = `${g.awayScore}-${g.homeScore}`;
  });

  let tbl = `<table class="h2h-table"><tr><th></th>${teams.map(t=>`<th title="${t.name}">${t.name.length>10?t.name.slice(0,9)+'…':t.name}</th>`).join('')}</tr>`;
  teams.forEach(home => {
    tbl += `<tr><td class="lbl">${home.name.length>12?home.name.slice(0,11)+'…':home.name}</td>`;
    teams.forEach(away => {
      if (home.id===away.id) { tbl+='<td class="self">—</td>'; return; }
      const r = results[home.id] && results[home.id][away.id];
      if (!r || (!r.w&&!r.l&&!r.d)) { tbl+='<td style="color:var(--fg3)">—</td>'; return; }
      const cls = r.w>r.l?'win':r.l>r.w?'loss':'draw';
      tbl += `<td class="${cls}" title="W:${r.w} L:${r.l} D:${r.d}">${r.last||'—'}</td>`;
    });
    tbl += '</tr>';
  });
  tbl += '</table>';
  h2h.innerHTML = tbl;

  const games = [...(state.games||[])].reverse();
  if (!games.length) { fl.innerHTML = '<div class="notice">no matches played yet</div>'; return; }

  const byRound = {};
  games.forEach(g => { const r=g.round||1; if(!byRound[r])byRound[r]=[]; byRound[r].push(g); });
  const rounds = Object.keys(byRound).sort((a,b)=>b-a);

  fl.innerHTML = rounds.map(r => {
    const collapsed = collapsedRounds.has(r);
    const matchCount = byRound[r].length;
    const rGames = byRound[r];

    // get weather from first game of the round (all games same round share weather)
    const w = rGames[0].weather;
    const weatherHtml = w ? `<div class="weather-box" style="border-color:${w.color}40">
      <div class="weather-icon">${w.icon}</div>
      <div class="weather-name" style="color:${w.color}">${w.name}</div>
      <div class="weather-desc">${w.desc}</div>
      <div class="weather-roll">roll: ${w.roll}${w.reroll ? ` → rerolled: ${w.reroll} (${w.originalName})` : ''}${w.heroId ? ` // survivor: ${(state.players.find(p=>p.id===w.heroId)||{name:'unknown'}).name}` : ''}</div>
    </div>` : '';

    const fixturesHtml = rGames.map(g => `
      <div class="fixture">
        <div class="fix-teams">
          <div style="flex:1;font-size:13px;font-weight:700">${g.home}</div>
          <div class="fix-score">${g.homeScore} – ${g.awayScore}</div>
          <div style="flex:1;text-align:right;font-size:13px;font-weight:700">${g.away}</div>
        </div>
        <div class="fix-report">${g.report||''}</div>
      </div>`).join('');

    return `
      <div class="round-hdr" onclick="toggleRound('${r}')">
        <span>round ${r} &nbsp;<span style="color:var(--fg3);font-weight:400;letter-spacing:.05em;text-transform:none;font-size:10px">${matchCount} match${matchCount!==1?'es':''}</span></span>
        <span class="round-toggle">${collapsed ? '▸' : '▾'}</span>
      </div>
      <div class="round-body${collapsed?' collapsed':''}">
        ${weatherHtml}
        ${fixturesHtml}
      </div>`;
  }).join('');
}

function renderStandings() {
  const tbl = document.getElementById('standingsTable'); if (!tbl) return;
  const ts = state.teams.map(t => {
    const games = (state.games||[]).filter(g=>g.homeId===t.id||g.awayId===t.id);
    let w=0,l=0,d=0,gf=0,ga=0;
    games.forEach(g => { const home=g.homeId===t.id; const tf=home?g.homeScore:g.awayScore; const ta=home?g.awayScore:g.homeScore; gf+=tf; ga+=ta; if(tf>ta)w++; else if(ta>tf)l++; else d++; });
    return {...t, w, l, d, gf, ga, pts: w*3+d};
  }).sort((a,b) => b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga));
  if (!ts.length) { tbl.innerHTML = '<div class="notice">no teams registered</div>'; return; }
  tbl.innerHTML = `<div class="srow" style="color:var(--fg3);font-size:10px"><div>#</div><div>team</div><div>W-D-L</div><div>pts</div></div>${ts.map((t,i)=>`<div class="srow"><div style="color:var(--fg3)">${i+1}</div><div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${(t.colors||['#888'])[0]};margin-right:5px"></span>${t.name}</div><div style="color:var(--fg2)">${t.w}-${t.d}-${t.l}</div><div style="color:var(--good)">${t.pts}</div></div>`).join('')}`;
}

function ownerDeleteTeam(id) {
  const t = state.teams.find(t=>t.id===id);
  if (!t || !confirm(`delete team "${t.name}"? their drafted players will be released.`)) return;
  Object.keys(state.draftedBy).forEach(pid => { if (state.draftedBy[pid]===id) delete state.draftedBy[pid]; });
  state.teams = state.teams.filter(t=>t.id!==id);
  state.games = state.games.filter(g=>g.homeId!==id&&g.awayId!==id);
  if (sessionStorage.getItem('uwc_myteam')===id) sessionStorage.removeItem('uwc_myteam');
  saveState(); render(); flash('team deleted');
}

function renderPlayerEditor() {

// ─── WEATHER SYSTEM ──────────────────────────────────────────────────────────
const WEATHER_TABLE = [
  { min:1,  max:30, name:'fair & mild',                     icon:'☀️',  color:'#ffcc44', effect:'none',        desc:'Conditions are unremarkable. The pitch is dry. The sky is the usual sky.' },
  { min:31, max:50, name:'stormy',                           icon:'⛈️',  color:'#44ccff', effect:'storm',       desc:'Rain hammers the pitch.' },
  { min:51, max:55, name:'earthquake',                       icon:'🌋',  color:'#ff8844', effect:'quake',       desc:'The ground moves. All stats are heightened unpredictably. Nothing can be relied upon.' },
  { min:56, max:60, name:'ravens',                           icon:'🐦‍⬛', color:'#cc88ff', effect:'ravens',      desc:'A murder of ravens settles on the crossbars. They watch everything.' },
  { min:61, max:65, name:'upside down',                      icon:'🙃',  color:'#88ff44', effect:'upside_down', desc:'Something is inverted' },
  { min:66, max:70, name:'eerie mist',                       icon:'🌫️',  color:'#ff4444', effect:'mist',        desc:'A pale mist rolls in from no particular direction. Watch yourself.' },
  { min:71, max:75, name:'odd figures hover over the pitch', icon:'👁️',  color:'#8844ff', effect:'figures',     desc:'They do not interfere. They observe.' },
  { min:76, max:80, name:'sudden blackout',                  icon:'⬛',  color:'#444444', effect:'blackout',    desc:'The lights go out. All players are reduced to nothing except one, who becomes everything.' },
  { min:81, max:85, name:'the beast that has no name',       icon:'❓',  color:'#ff4444', effect:'beast',       desc:'It arrives. It watches. It has no effect on the score. The players do not speak of it afterward.' },
  { min:86, max:90, name:'quicksand',                        icon:'🏜️',  color:'#ff8844', effect:'quicksand',   desc:'The pitch thickens underfoot..' },
  { min:91, max:95, name:'zero gravity forcefield explodes', icon:'🌀',  color:'#44ff88', effect:'gravity',     desc:'For reasons that remain classified, goalies and midfielders achieve extraordinary things.' },
  { min:96, max:100,name:'no weather is present',            icon:'🤔',  color:'#888888', effect:'reroll',      desc:'Which seems odd. The league does not comment.' },
];

function rollWeather() {
  const roll = Math.floor(Math.random() * 100) + 1;
  let w = WEATHER_TABLE.find(w => roll >= w.min && roll <= w.max);
  // 96-100: "no weather present" — reroll once
  if (w.effect === 'reroll') {
    const roll2 = Math.floor(Math.random() * 95) + 1;
    const w2 = WEATHER_TABLE.find(w => roll2 >= w.min && roll2 <= w.max);
    return { ...w2, roll, reroll: roll2, originalName: w.name };
  }
  return { ...w, roll };
}

// Apply weather multipliers to a working copy of a player's stats
// Returns a new player object — does NOT mutate state.players
function applyWeather(player, weather, allPlayers) {
  const p = { ...player };
  const ef = weather.effect;

  if (ef === 'none' || ef === 'beast') return p;  // no change

  if (ef === 'storm') {
    // small benefit to defenders and goalies
    if (p.pos === 'defender' || p.pos === 'goalie') {
      p.def = Math.min(100, Math.round(p.def * 2.25));
      p.stm = Math.min(100, Math.round(p.stm * 2.15));
    }
  }

  if (ef === 'quake') {
    // heighten random stats unpredictably
    const fields = ['spd','str','def','vis','stm'];
    fields.forEach(f => {
      const mult = 0.7 + Math.random() * 0.9; // 0.7x–1.6x each
      p[f] = Math.min(100, Math.round(p[f] * mult));
    });
  }

  if (ef === 'ravens') {
    // triple hustle (stm)
    p.stm = Math.min(100, p.stm * 3);
  }

  if (ef === 'upside_down') {
    // double stats for players whose name comes alphabetically first
    const names = allPlayers.map(pl => pl.name).sort();
    const median = names[Math.floor(names.length / 2)];
    if (p.name.localeCompare(median) < 0) {
      ['spd','str','def','vis','stm'].forEach(f => p[f] = Math.min(100, p[f] * 2));
    }
  }

  if (ef === 'mist') {
    // triple all stats for attackers
    if (p.pos === 'attacker') {
      ['spd','str','def','vis','stm'].forEach(f => p[f] = Math.min(100, p[f] * 3));
    }
  }

  if (ef === 'figures') {
    // randomize all stats
    ['spd','str','def','vis','stm'].forEach(f => p[f] = Math.floor(Math.random() * 100) + 1);
  }

  if (ef === 'blackout') {
    // stored on weather object: one chosen player gets all stats maxed, rest go to 0
    if (weather._heroId && p.id === weather._heroId) {
      ['spd','str','def','vis','stm'].forEach(f => p[f] = 100);
    } else {
      ['spd','str','def','vis','stm'].forEach(f => p[f] = 0);
    }
  }

  if (ef === 'quicksand') {
    p.spd = Math.min(100, p.spd * 2);
  }

  if (ef === 'gravity') {
    if (p.pos === 'goalie' || p.pos === 'midfielder') {
      ['spd','str','def','vis','stm'].forEach(f => p[f] = Math.min(100, p[f] * 3));
    }
  }

  return p;
}

function runSim() {
  if (state.teams.length < 2) { flash('need 2+ teams'); return; }
  state.roundNum = (state.roundNum||0) + 1;

  // Roll weather
  const weather = rollWeather();

  // For blackout: pick one random player from all drafted players as the hero
  if (weather.effect === 'blackout') {
    const allDrafted = Object.keys(state.draftedBy);
    if (allDrafted.length > 0) {
      weather._heroId = allDrafted[Math.floor(Math.random() * allDrafted.length)];
    }
  }

  const teams = [...state.teams];
  for (let i=0; i<teams.length-1; i++) {
    for (let j=i+1; j<teams.length; j++) {
      const h = teams[i], a = teams[j];

      // Get rosters and apply weather
      const hRaw = Object.entries(state.draftedBy).filter(([pid,tid])=>tid===h.id).map(([pid])=>state.players.find(p=>p.id===pid)).filter(Boolean);
      const aRaw = Object.entries(state.draftedBy).filter(([pid,tid])=>tid===a.id).map(([pid])=>state.players.find(p=>p.id===pid)).filter(Boolean);
      const hR = hRaw.map(p => applyWeather(p, weather, state.players));
      const aR = aRaw.map(p => applyWeather(p, weather, state.players));

      const hAtk = hR.filter(p=>p.pos==='attacker').reduce((s,p)=>s+calcScore(p),0);
      const hMid = hR.filter(p=>p.pos==='midfielder').reduce((s,p)=>s+calcScore(p),0);
      const hDef = hR.filter(p=>p.pos==='defender').reduce((s,p)=>s+calcScore(p),0);
      const hGk  = hR.filter(p=>p.pos==='goalie').reduce((s,p)=>s+calcScore(p),0);
      const aAtk = aR.filter(p=>p.pos==='attacker').reduce((s,p)=>s+calcScore(p),0);
      const aMid = aR.filter(p=>p.pos==='midfielder').reduce((s,p)=>s+calcScore(p),0);
      const aDef = aR.filter(p=>p.pos==='defender').reduce((s,p)=>s+calcScore(p),0);
      const aGk  = aR.filter(p=>p.pos==='goalie').reduce((s,p)=>s+calcScore(p),0);

      const hPow = hAtk*2 + hMid - (aDef+aGk+aMid*0.5) + Math.floor(Math.random()*80) + 20;
      const aPow = aAtk*2 + aMid - (hDef+hGk+hMid*0.5) + Math.floor(Math.random()*80) + 20;

      const g = {
        home: h.name, away: a.name, homeId: h.id, awayId: a.id,
        homeScore: Math.max(0, Math.round(hPow/120)),
        awayScore: Math.max(0, Math.round(aPow/120)),
        round: state.roundNum,
        weather: {
          name: weather.name,
          icon: weather.icon,
          color: weather.color,
          desc: weather.desc,
          roll: weather.roll,
          reroll: weather.reroll || null,
          originalName: weather.originalName || null,
          heroId: weather._heroId || null,
        }
      };
      g.report = generateReport(g);
      state.games.push(g);
    }
  }
  saveState(); renderLeague(); renderStandings();
  flash(`round ${state.roundNum} — weather: ${weather.name}`);
}

function showCreateTeam() { showTeamModal(null); }
function showEditTeam(id) { showTeamModal(state.teams.find(t=>t.id===id)); }

function showTeamModal(existing) {
  const isNew = !existing;
  const sel = existing ? (existing.colors||[]) : ['#e8e8e8'];
  const mount = document.getElementById('modalMount');
  mount.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-title">${isNew?'create a new team':'edit team'}</div>
    <div style="margin-bottom:10px"><div class="elabel" style="margin-bottom:5px">team name</div><input type="text" id="tname" value="${existing?existing.name:''}" placeholder="the void walkers" maxlength="32"></div>
    <div style="margin-bottom:10px"><div class="elabel" style="margin-bottom:5px">motto</div><input type="text" id="tmotto" value="${existing?existing.motto||'':''}" placeholder="from nothing, everything" maxlength="60"></div>
    <div style="margin-bottom:18px"><div class="elabel" style="margin-bottom:6px">team colors (pick up to 3)</div>
    <div class="color-picker">${COLORS.map(c=>`<div class="sw${sel.includes(c)?' sel':''}" style="background:${c}" data-c="${c}" onclick="toggleSw(this)"></div>`).join('')}</div></div>
    <div class="brow">
      <button class="good" onclick="saveTeam(${isNew},'${existing?existing.id:''}')">${isNew?'create team':'save changes'}</button>
      <button onclick="closeModal()">cancel</button>
    </div>
  </div></div>`;
}

function toggleSw(el) {
  const s = document.querySelectorAll('.sw.sel');
  if (el.classList.contains('sel')) el.classList.remove('sel');
  else { if (s.length>=3) s[0].classList.remove('sel'); el.classList.add('sel'); }
}

function saveTeam(isNew, existingId) {
  const name = document.getElementById('tname').value.trim();
  if (!name) { flash('team needs a name'); return; }
  const motto = document.getElementById('tmotto').value.trim();
  const colors = [...document.querySelectorAll('.sw.sel')].map(el=>el.dataset.c);
  if (isNew) {
    const id = 't'+Date.now();
    state.teams.push({id, name, motto, colors: colors.length?colors:['#e8e8e8']});
    sessionStorage.setItem('uwc_myteam', id);
  } else {
    const idx = state.teams.findIndex(t=>t.id===existingId);
    if (idx>=0) state.teams[idx] = {id:existingId, name, motto, colors: colors.length?colors:['#e8e8e8']};
  }
  saveState(); closeModal(); render();
}

function closeModal() { document.getElementById('modalMount').innerHTML = ''; }

function switchTab(name) {
  document.querySelectorAll('.tc').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  const map = {players:0, draft:1, teams:2, league:3, standings:4, owner:5};
  document.querySelectorAll('.tab')[map[name]].classList.add('active');
  if (name==='draft') renderDraft();
  if (name==='owner') renderOwner();
  if (name==='league') renderLeague();
  if (name==='teams') renderTeams();
}

let ft;
function flash(msg) {
  const t = document.getElementById('ticker');
  t.textContent = '// ' + msg;
  t.style.color = 'var(--good)';
  clearTimeout(ft);
  ft = setTimeout(() => { updateTicker(); t.style.color = ''; }, 2400);
}

loadState();
render();
