<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unworld Cup // Live Feed</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #16181c;
      --border: #2f3336;
      --text: #e7e9ea;
      --dim: #71767b;
      --accent: #ff4444; /* Bleeding red accent instead of twitter blue */
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--dim);
    }

    .feed {
      display: flex;
      flex-direction: column;
    }

    .tweet {
      display: flex;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s;
    }

    .tweet:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .tweet-content {
      flex-grow: 1;
    }

    .tweet-header {
      display: flex;
      align-items: center;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .display-name {
      font-weight: 700;
      color: var(--text);
      margin-right: 4px;
    }

    .handle {
      color: var(--dim);
      margin-right: 8px;
    }

    .timestamp {
      color: var(--dim);
    }

    .tweet-text {
      font-size: 15px;
      line-height: 20px;
      white-space: pre-wrap;
    }

    .match-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: var(--accent);
      background: rgba(255, 68, 68, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .tweet-actions {
      display: flex;
      margin-top: 12px;
      color: var(--dim);
      font-size: 13px;
      gap: 40px;
    }

    .action-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .action-item:hover {
      color: var(--text);
    }

    .no-data {
      padding: 40px;
      text-align: center;
      color: var(--dim);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="feed-title">👁️ The Unworld Feed</h1>
      <p>Causality reports & timeline drift indicators</p>
    </header>

    <div id="feed" class="feed">
      </div>
  </div>

  <script>
    const STORAGE_KEY = 'unworldcup_v1';

    // Account profiles to make the data feel alive and weird
    const ACCOUNTS = [
      { name: "The Ministry of Offside Math", handle: "@realsignals", avatar: "🔮" },
      { name: "Local Groundskeeper (Missing)", handle: "@pitchwatcher", avatar: "💀" },
      { name: "Unworld Cup Bureau", handle: "@the_index", avatar: "👁️" },
      { name: "Archive Drone 09", handle: "@void_sports", avatar: "🛸" },
      { name: "An Absolute Lad", handle: "@bum_time_enjoyer", avatar: "🍺" }
    ];

    function loadFeed() {
      const feedContainer = document.getElementById('feed');
      
      // 1. Pull data directly from your simulation storage
      const rawData = localStorage.getItem(STORAGE_KEY);
      
      if (!rawData) {
        feedContainer.innerHTML = '<div class="no-data">The timeline is completely quiet. Run some match simulations first to broadcast signals.</div>';
        return;
      }

      const state = JSON.parse(rawData);
      const games = state.games || [];

      if (games.length === 0) {
        feedContainer.innerHTML = '<div class="no-data">0 transmissions found. Awaiting match reports...</div>';
        return;
      }

      // 2. Clear out container and render games backward (Newest tweets at the top)
      feedContainer.innerHTML = '';
      
      const reversedGames = [...games].reverse();

      reversedGames.forEach((game, index) => {
        // Distribute accounts randomly so the feed has distinct voices
        const account = ACCOUNTS[index % ACCOUNTS.length];
        
        // Format randomized metrics that look appropriately surreal
        const retweets = Math.floor(Math.random() * 400) + (game.isFeast ? 666 : 12);
        const likes = Math.floor(Math.random() * 900) + " souls";
        
        const tweetHTML = `
          <div class="tweet">
            <div class="avatar">${game.weather?.icon || account.avatar}</div>
            <div class="tweet-content">
              <div class="tweet-header">
                <span class="display-name">${account.name}</span>
                <span class="handle">${account.handle}</span>
                <span class="handle">·</span>
                <span class="timestamp">R${game.round}</span>
              </div>
              <div class="tweet-text">
                <strong>${game.home} ${game.homeScore} – ${game.awayScore} ${game.away}</strong>
                <br><br>${game.report || 'The match occurred in silence.'}
              </div>
              <div>
                <span class="match-tag">🌤️ Weather: ${game.weather?.name || 'Unrecorded'}</span>
              </div>
              <div class="tweet-actions">
                <div class="action-item">💬 <span>${Math.floor(Math.random() * 40)}</span></div>
                <div class="action-item">🔄 <span>${retweets}</span></div>
                <div class="action-item">❤️ <span>${likes}</span></div>
              </div>
            </div>
          </div>
        `;
        
        feedContainer.innerHTML += tweetHTML;
      });
    }

    // Run layout on page open
    window.onload = loadFeed;
  </script>
</body>
</html>
