<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unworld Cup // Live Feed</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #16181c;
      --border: #2f3336;
      --text: #e7e9ea;
      --dim: #71767b;
      --accent: #ff4444;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--dim);
    }

    .feed {
      display: flex;
      flex-direction: column;
    }

    .tweet {
      display: flex;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s;
    }

    .tweet:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Round divider */
    .round-divider {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,68,68,0.04);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .round-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .tweet-content {
      flex-grow: 1;
    }

    .tweet-header {
      display: flex;
      align-items: baseline;
      font-size: 15px;
      margin-bottom: 4px;
      flex-wrap: wrap;
      gap: 4px;
    }

    .display-name {
      font-weight: 700;
      color: var(--text);
    }

    .handle {
      color: var(--dim);
      font-size: 14px;
    }

    .timestamp {
      color: var(--dim);
      font-size: 13px;
      margin-left: auto;
    }

    .tweet-text {
      font-size: 15px;
      line-height: 22px;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }

    /* Inline match tag — small, unobtrusive */
    .match-ref {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--dim);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .match-ref strong {
      color: var(--accent);
    }

    .tweet-actions {
      display: flex;
      margin-top: 12px;
      color: var(--dim);
      font-size: 13px;
      gap: 36px;
    }

    .action-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: default;
      user-select: none;
    }

    .action-item:hover {
      color: var(--text);
    }

    .no-data {
      padding: 40px;
      text-align: center;
      color: var(--dim);
      font-style: italic;
      line-height: 1.8;
    }

    /* Reply-style indent */
    .tweet.reply {
      padding-left: 32px;
      border-left: 2px solid var(--border);
      margin-left: 20px;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="feed-title">👁️ The Unworld Feed</h1>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2XngHSIcP-A6_ebpEZR4LyZNJ5mz01LM",
    authDomain: "unworldcup.firebaseapp.com",
    databaseURL: "https://unworldcup-default-rtdb.firebaseio.com",
    projectId: "unworldcup",
    storageBucket: "unworldcup.firebasestorage.app",
    messagingSenderId: "666050004526",
    appId: "1:666050004526:web:54f2973452797e0b6581bf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const leagueRef = ref(db, 'league');

  // Push live state into the feed whenever Firebase updates
  onValue(leagueRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      window._liveState = data;
      if (typeof window._renderFeed === 'function') window._renderFeed(data);
    }
  });
</script>

        `i got in through the turnstile that goes click click click and now i cant find the way back out. the man in the orange jacket said to wait here but he has not come back. the match was ${g.homeScore}–${g.awayScore}.`,

    priest: (g, state) => {
      const winner = g.homeScore > g.awayScore ? g.home : g.homeScore < g.awayScore ? g.away : null;
      const potm = g.potm;
      const total = g.homeScore + g.awayScore;

    binary: (g, state) => {
      // Generates plausible-looking binary strings, occasionally with a fragment of something legible
      function toBin(n, bits) {
        return n.toString(2).padStart(bits, '0');
      }
      function makeNoise(len) {
        let s = '';
        for (let i = 0; i < len; i++) {
          s += Math.random() > 0.5 ? '1' : '0';
          if ((i + 1) % 8 === 0 && i < len - 1) s += ' ';
        }
        return s;
      }
      const homeBin = [...g.home].map(c => toBin(c.charCodeAt(0), 8)).join(' ');
      const scoreBin = toBin(g.homeScore, 4) + ' ' + toBin(g.awayScore, 4);
      const roundBin = toBin(g.round, 8);
      const leaks = [
        `...THEY ARE NOT PLAYING FOOTBALL...`,
        `...THE SCORE IS WRONG...`,
        `...DO NOT ATTEND THE GROUND...`,
        `...IT SAW ME...`,
        `...HELP...`,
        `...THE TABLE IS COMPLETE...`,
        `...WE WERE THERE FIRST...`,
      ];
      const leak = rnd(leaks);
      return rnd([
        makeNoise(64),
        `${makeNoise(24)}\n${scoreBin}\n${makeNoise(24)}`,
        `01010010 01000101 01010011 01010101 01001100 01010100\n${scoreBin}\n${makeNoise(32)}`,
        `${roundBin}\n${makeNoise(16)} ${homeBin.slice(0, 23)} ${makeNoise(16)}`,
        `${makeNoise(32)}\n// ${leak}\n${makeNoise(32)}`,
        `00000000 00000000 00000000 ${scoreBin} 00000000 00000000 00000000`,
        `${makeNoise(8)} ${scoreBin} ${makeNoise(8)}\n${makeNoise(8)} ${roundBin} ${makeNoise(8)}\n${makeNoise(64)}`,
        `11111111 11111111\n${makeNoise(48)}\n// ${leak}\n11111111 11111111`
      ]);
    },

    butcher: (g, state) => {

    pigeon: (g, state) => {
      return rnd([

    insomniac: (g, state) => {

  };

  // ─── HELPER FUNCTIONS ──────────────────────────────────────────────────────

  function rnd(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // Seeded random for stable per-match determinism
  function seededRandom(seed) {
    let h = 0;
    const s = String(seed);
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(31, h) + s.charCodeAt(i) | 0;
    }
    return Math.abs(h % 1000) / 1000;
  }

  function getManager(state, teamName) {
    if (!state.teams) return null;
    const team = state.teams.find(t => t.name === teamName);
    return team?.manager || null;
  }

  function getAllPlayers(state) {
    if (!state.teams) return [];
    return state.teams.flatMap(t => (t.players || []).map(p => p.name)).filter(Boolean);
  }

  // The "fan" account's team — whoever has the most games played (longest-running team)
  function getFanTeam(state) {
    if (!state.teams || state.teams.length === 0) return null;
    return state.teams[0].name;
  }

  // Ultra's team is derived from whichever team in this fixture has a lower standing
  function getUltraTeam(state, game) {
    if (game.homeScore > game.awayScore) return game.home;
    if (game.awayScore > game.homeScore) return game.away;
    return game.home;
  }

  // ─── TEAM BOTS ─────────────────────────────────────────────────────────────
  // Each team in the league gets its own bot account, dynamically generated
  // from the team's data (name, manager, emoji, motto, homeGround).
  // Personality archetype is seeded from the team name so it's always consistent.
  //
  // 7 personality archetypes, one assigned per team by name hash:
  //   0: the_pr        — official club comms, corporate but cracking
  //   1: the_manager   — the manager's personal account, thinly veiled
  //   2: the_captain   — team captain energy, motivational and slightly unhinged
  //   3: the_historian — this club has lore and they will tell you about it
  //   4: the_cursed    — the fan who has been following this team too long
  //   5: the_scout     — tactical brain who has seen too much
  //   6: the_ghost     — something that used to be associated with the club

  function makeTeamHandle(teamName) {
    return '@' + teamName.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 14) + '_official';
  }

  function teamPersonalityIndex(teamName) {
    let h = 0;
    for (let i = 0; i < teamName.length; i++) {
      h = Math.imul(31, h) + teamName.charCodeAt(i) | 0;
    }
    return Math.abs(h) % 7;
  }

  // Returns a post string for a team bot, given the game and which side they were on
  function generateTeamBotPost(team, game, isHome) {
    const us = isHome ? game.home : game.away;
    const them = isHome ? game.away : game.home;
    const ourScore = isHome ? game.homeScore : game.awayScore;
    const theirScore = isHome ? game.awayScore : game.homeScore;
    const won = ourScore > theirScore;
    const lost = ourScore < theirScore;
    const drew = ourScore === theirScore;
    const scoreline = `${ourScore}–${theirScore}`;
    const mgr = team.manager || 'the manager';
    const ground = team.homeGround || 'the ground';
    const motto = team.motto || null;
    const potm = game.potm || null;

        `We thank ${them} for a competitive fixture and wish them well in their remaining matches except the ones that affect our position in the table.`,

      // 1: the_manager — the gaffer's personal account. wry, exhausted, occasionally wise
      () => rnd(won ? [
        `Asked the lads to show me something today. They showed me something. I won't say what. But I saw it. Proud of them. Genuinely.`,

        `${weather} didn't help. Neither did several other things I'm not going to name publicly. The work continues. It always continues.`,
      ]),

      // 2: the_captain — raw energy, win or lose, always About The Team
      () => rnd(won ? [
        `YESSSSSS. COME ON. ${us.toUpperCase()}. That's what we're about. That is EXACTLY what we're about. ${them} gave it everything and we gave it MORE. See you next round.`,
        `Three points. Backs against the wall in the second half. Didn't matter. These players. Honestly. I'd run through a wall for every single one of them. Possibly literally given what happened at ${ground}.`,
        `${potm ? (potm + " was unreal today. I said it in the dressing room and I'll say it here: player of the generation.") : "Everyone a 10 today. I mean it. Even the ones who had a nightmare. They had a nightmare WITH HEART."}`,

      ] : [

      // 3: the_historian — deep lore, long memory, slightly unwell about it
      () => rnd(won ? [

        `This result echoes something. I can feel it echoing. There are patterns in this league that predate the teams themselves and today's ${scoreline} is one of them.`,

        `${them} win today. They have won here before. Not often. But the times they have, something happened afterward that I will not describe in a public forum.`,

      ] : drew ? [

      ] : [
        `I knew. I KNEW. Before kickoff I knew. I always know and I always go anyway and I always end up feeling exactly like this. Why am I like this.`,

      // 5: the_scout — tactical obsessive, sees things in the game no one else cares about
      () => rnd(won ? [
        `What ${mgr} did with the defensive line in the second half was genuinely fascinating and I need people to understand that before they just talk about the score. The score is almost beside the point. Almost.`,

      ] : drew ? [

      () => rnd(won ? [

      ] : [
        `They'll recover. They always recover. I've watched longer than anyone and there is always another round. There is always another round until there isn't and then there is the thing that comes after.`,

        `A loss. The pitch absorbs it. The pitch absorbs everything eventually. I know this better than most.`,
      ]),
    ];

    return TEAM_VOICES[pIdx]();
  }

  // Build a team bot account object from a team's data
  function makeTeamBotAccount(team) {
    const pIdx = teamPersonalityIndex(team.name);
    const suffixes = ['Official', 'FC_News', 'Insider', 'Archive', 'Chronicle', 'Supporter', 'Presence'];
    const prefixLabels = [
      `${team.name} Official`,
      `${team.manager ? team.manager.split(' ')[0] : team.name} (Personal)`,
      `${team.emoji || '⚽'} ${team.name} Captain`,
      `${team.name} Historical Society`,
      `${team.name} Sufferer`,
      `${team.name} Scout Dept`,
      `Something from ${team.name}`,
    ];
    return {
      name: prefixLabels[pIdx],
      handle: makeTeamHandle(team.name),
      avatar: team.emoji || '⚽',
      teamName: team.name,
      teamColor: team.color || team.colors?.[0] || null,
      isTeamBot: true,
    };
  }

  // ─── GENERATE POSTS PER GAME ───────────────────────────────────────────────

  // Generate multiple posts per match from different accounts
  function generatePostsForGame(game, state, gameIndex) {
    // Core bots always in rotation
    const coreKeys = ['bureau', 'groundskeeper', 'lad', 'ultras', 'prophet', 'drone', 'ministry'];
    // Odd bots appear occasionally — seeded so the same game always gets the same ones
    const oddKeys = ['lostchild', 'priest', 'binary', 'butcher', 'geologist', 'pigeon', 'insomniac'];

    const posts = [];

    // 2–3 core bot posts per game
    const numCore = 2 + (gameIndex % 2);
    const seed = game.home.charCodeAt(0) + game.away.charCodeAt(0) + game.round * 7;
    const startIdx = seed % coreKeys.length;

    for (let i = 0; i < numCore; i++) {
      const key = coreKeys[(startIdx + i) % coreKeys.length];
      const account = ACCOUNTS[key];
      const text = GENERATORS[account.voice](game, state);
      posts.push({ account, text, isReply: i > 0 });
    }

    // 1–2 odd bot posts per game, seeded selection
    const numOdd = 1 + (Math.floor(seededRandom(game.home + game.round + 'odd') * 2) > 0.6 ? 1 : 0);
    const oddStart = Math.floor(seededRandom(game.away + game.round + 'oddstart') * oddKeys.length);
    for (let i = 0; i < numOdd; i++) {
      const key = oddKeys[(oddStart + i) % oddKeys.length];
      const account = ACCOUNTS[key];
      const text = GENERATORS[account.voice](game, state);
      posts.push({ account, text, isReply: true });
    }

    // Team bot posts (home then away)
    if (state.teams && state.teams.length > 0) {
      const homeTeam = state.teams.find(t => t.name === game.home);
      const awayTeam = state.teams.find(t => t.name === game.away);

      if (homeTeam) {
        const account = makeTeamBotAccount(homeTeam);
        const text = generateTeamBotPost(homeTeam, game, true);
        posts.push({ account, text, isReply: true });
      }
      if (awayTeam) {
        const account = makeTeamBotAccount(awayTeam);
        const text = generateTeamBotPost(awayTeam, game, false);
        posts.push({ account, text, isReply: true });
      }
    }

    return posts;
  }

  function generateMetrics(game, isReply) {
    // Surreal-ish numbers. Feast games get elevated engagement.
    const base = game.isFeast ? 400 : 0;
    const comments = Math.floor(seededRandom(game.home + 'c') * 40) + 1;
    const retweets = Math.floor(seededRandom(game.away + 'r') * 300) + base + 14;
    const likes = Math.floor(seededRandom(game.home + game.round + 'l') * 800) + base;
    const soulSuffix = likes < 100 ? ' souls' : likes < 500 ? ' witnesses' : ' believers';
    return { comments, retweets, likes: likes + soulSuffix };
  }

  // ─── RENDER ────────────────────────────────────────────────────────────────

  function renderFeed(state) {
    const feedContainer = document.getElementById('feed');
    const games = state.games || [];

    if (games.length === 0) {
      feedContainer.innerHTML = '<div class="no-data">0 transmissions found.<br>Awaiting match reports...</div>';
      return;
    }

    feedContainer.innerHTML = '';

    // Newest matches at the top
    const reversedGames = [...games].reverse();
    let lastRound = null;

    reversedGames.forEach((game, gameIndex) => {
      // Insert a round divider when the round changes
      if (game.round !== lastRound) {
        lastRound = game.round;
        const divider = document.createElement('div');
        divider.className = 'round-divider';
        divider.textContent = `Round ${game.round}`;
        feedContainer.appendChild(divider);
      }

      const posts = generatePostsForGame(game, state, gameIndex);

      posts.forEach((post) => {
        const metrics = generateMetrics(game, post.isReply);

        const tweet = document.createElement('div');
        tweet.className = post.isReply ? 'tweet reply' : 'tweet';

        const teamColor = post.account.teamColor || null;
        const avatarStyle = teamColor
          ? `border-color: ${teamColor}; box-shadow: 0 0 8px ${teamColor}55;`
          : '';
        const nameExtra = teamColor
          ? `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${teamColor};margin-left:5px;vertical-align:middle;"></span>`
          : '';
        const avatarGlyph = post.account.isTeamBot
          ? (post.account.avatar || '⚽')
          : pickAvatar(post.account, game);

        tweet.innerHTML = `
          <div class="avatar" style="${avatarStyle}">${avatarGlyph}</div>
          <div class="tweet-content">
            <div class="tweet-header">
              <span class="display-name">${post.account.name}${nameExtra}</span>
              <span class="handle">${post.account.handle}</span>
              <span class="timestamp">R${game.round}</span>
            </div>
            <div class="tweet-text">${post.text}</div>
            ${!post.isReply ? `<div class="match-ref">
              <strong>${game.home} ${game.homeScore}–${game.awayScore} ${game.away}</strong>
              &nbsp;·&nbsp;${game.weather?.icon || '🌫️'} ${game.weather?.name || 'Unknown Conditions'}
            </div>` : ''}
            <div class="tweet-actions">
              <div class="action-item">💬 <span>${metrics.comments}</span></div>
              <div class="action-item">🔄 <span>${metrics.retweets}</span></div>
              <div class="action-item">❤️ <span>${metrics.likes}</span></div>
            </div>
          </div>
        `;

        feedContainer.appendChild(tweet);
      });
    });
  }

  // Expose so the Firebase module block can call it on live updates
  window._renderFeed = renderFeed;

  // On load: show a connecting indicator, then render from localStorage as
  // an immediate fallback while Firebase comes in (usually < 1 second).
  window.onload = function () {
    const feedContainer = document.getElementById('feed');

    // If Firebase has already fired by the time onload runs, use it directly
    if (window._liveState) {
      renderFeed(window._liveState);
      return;
    }

    // Otherwise show a brief connecting state, and try localStorage as fallback
    feedContainer.innerHTML = '<div class="no-data" id="connecting-msg">Connecting to the Unworld...<br><span style="font-size:11px;opacity:0.5">syncing with Firebase</span></div>';

    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const localState = JSON.parse(raw);
        if ((localState.games || []).length > 0) {
          renderFeed(localState);
        }
      } catch (e) { /* ignore malformed local data */ }
    }

    // Firebase onValue will call window._renderFeed when it arrives,
    // overwriting whatever the localStorage fallback rendered.
  };
</script>
</body>
</html>
