<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unworld Cup // Live Feed</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #16181c;
      --border: #2f3336;
      --text: #e7e9ea;
      --dim: #71767b;
      --accent: #ff4444;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--dim);
    }

    .feed {
      display: flex;
      flex-direction: column;
    }

    .tweet {
      display: flex;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s;
    }

    .tweet:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Round divider */
    .round-divider {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,68,68,0.04);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .round-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .tweet-content {
      flex-grow: 1;
    }

    .tweet-header {
      display: flex;
      align-items: baseline;
      font-size: 15px;
      margin-bottom: 4px;
      flex-wrap: wrap;
      gap: 4px;
    }

    .display-name {
      font-weight: 700;
      color: var(--text);
    }

    .handle {
      color: var(--dim);
      font-size: 14px;
    }

    .timestamp {
      color: var(--dim);
      font-size: 13px;
      margin-left: auto;
    }

    .tweet-text {
      font-size: 15px;
      line-height: 22px;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }

    /* Inline match tag — small, unobtrusive */
    .match-ref {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--dim);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .match-ref strong {
      color: var(--accent);
    }

    .tweet-actions {
      display: flex;
      margin-top: 12px;
      color: var(--dim);
      font-size: 13px;
      gap: 36px;
    }

    .action-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: default;
      user-select: none;
    }

    .action-item:hover {
      color: var(--text);
    }

    .no-data {
      padding: 40px;
      text-align: center;
      color: var(--dim);
      font-style: italic;
      line-height: 1.8;
    }

    /* Reply-style indent */
    .tweet.reply {
      padding-left: 32px;
      border-left: 2px solid var(--border);
      margin-left: 20px;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="feed-title">👁️ The Unworld Feed</h1>
      <p>Causality reports & timeline drift indicators</p>
    </header>

    <div id="feed" class="feed"></div>
  </div>

<script>
  const STORAGE_KEY = 'unworldcup_v1';

  // ─── ACCOUNT ARCHETYPES ────────────────────────────────────────────────────
  // Each account has a voice that shapes every post they make.
  const ACCOUNTS = {
    bureau: {
      name: "Unworld Cup Bureau",
      handle: "@the_index",
      avatar: "👁️",
      // Dry, official, deeply unsettling. Announces things like they're policy documents.
      voice: 'official'
    },
    groundskeeper: {
      name: "Local Groundskeeper (Missing)",
      handle: "@pitchwatcher",
      avatar: "💀",
      // First-person, confused, trauma responses. Was there. Not sure what they saw.
      voice: 'witness'
    },
    lad: {
      name: "An Absolute Lad",
      handle: "@bum_time_enjoyer",
      avatar: "🍺",
      // Genuine football fan who is slowly realizing this league is wrong. Uses normal football slang.
      voice: 'fan'
    },
    ultras: {
      name: "Ultra Sec 4",
      handle: "@red_void_ultras",
      avatar: "🚩",
      // Aggressively partisan. Deeply committed to a team that hasn't won in years.
      voice: 'ultra'
    },
    prophet: {
      name: "Terrace Prophet",
      handle: "@the_unseen",
      avatar: "🫀",
      // Cryptic pronouncements. Short. Never explains. Everything is a portent.
      voice: 'prophet'
    },
    drone: {
      name: "Archive Drone 09",
      handle: "@void_sports",
      avatar: "🛸",
      // Robotic stats-and-data account that has developed opinions it cannot process.
      voice: 'drone'
    },
    ministry: {
      name: "Ministry of Offside Math",
      handle: "@realsignals",
      avatar: "🔮",
      // Football analytics person who has gone completely off the deep end.
      voice: 'analyst'
    }
  };

  // ─── POST GENERATORS BY VOICE ──────────────────────────────────────────────
  // Each function returns an array of possible posts for that account archetype.
  // Posts reference real data: team names, player names, managers, scores, weather.

  const GENERATORS = {

    official: (g, state) => {
      const winner = g.homeScore > g.awayScore ? g.home : g.homeScore < g.awayScore ? g.away : null;
      const loser = g.homeScore > g.awayScore ? g.away : g.homeScore < g.awayScore ? g.home : null;
      const potm = g.potm;
      return rnd([
        `RESULT REGISTERED. ${g.home} ${g.homeScore}–${g.awayScore} ${g.away}. The appropriate authorities have been notified. Affected spectators should report to sector nine.`,
        `Match classification: ${g.homeScore === g.awayScore ? 'NULL EVENT' : 'DECISIVE'}. ${winner ? winner + ' claims the points.' : 'No winner. The points have been absorbed.'} Citizens are reminded to remain in their designated zones.`,
        `Post-match update: ${potm ? potm + ' has been named Player of the Match. Their details have been added to the register.' : 'Player of the Match designation: WITHHELD.'} Weather conditions during the fixture have been noted for historical accuracy.`,
        `Round ${g.round} fixture processed. ${loser ? loser + ' are reminded that failure to accrue points is not, in itself, a violation. It merely places you closer to the threshold.' : g.home + ' processed the outcome as mandated.'}`,
        `NOTICE: The result of ${g.home} vs ${g.away} has been entered into the permanent record. Any attempts to dispute the scoreline will be handled by the Dispute Bureau, which does not exist.`
      ]);
    },

    witness: (g, state) => {
      const potm = g.potm;
      const manager_home = getManager(state, g.home);
      const manager_away = getManager(state, g.away);
      return rnd([
        `I was at the ${g.home} ground today. When the final whistle blew I couldn't remember which team I'd come to support. I'm still not sure. My seat was wet when I sat down but it hadn't rained.`,
        `${potm ? potm + ' was out there doing something I cannot describe using standard football vocabulary.' : 'I watched the whole match and I genuinely cannot tell you what I saw.'} The grass was too green. It made my eyes hurt.`,
        `The ${g.weather?.name || 'weather'} today at the ${g.home} match. The ${g.weather?.name || 'weather'} during a game like this. I need everyone to understand that I don't go to matches anymore. This was my last one.`,
        `${manager_home ? manager_home + ' was pacing the technical area and I could have sworn his shadow wasn\'t keeping up.' : 'The manager was very still in the technical area. Very, very still. When he finally blinked everyone gasped.'}`,
        `I don't remember the journey home from the ${g.home} vs ${g.away} match. I woke up in my kitchen. The kettle was already on. Something had been kind enough to make me tea.`
      ]);
    },

    fan: (g, state) => {
      const winner = g.homeScore > g.awayScore ? g.home : g.homeScore < g.awayScore ? g.away : null;
      const loser = winner === g.home ? g.away : winner === g.away ? g.home : null;
      const margin = Math.abs(g.homeScore - g.awayScore);
      const potm = g.potm;
      const myTeam = getFanTeam(state);
      return rnd([
        `mate I'm just trying to watch football and ${g.home} have got three players called ${potm || 'someone'} on their pitch I swear on my life something is wrong with the squad list`,
        `${g.homeScore === g.awayScore ? 'draws are draws lads' : winner + ' deserved that honestly, ' + loser + ' were absolutely shocking second half'}, the ref was having a nightmare in the first half but honestly who wasn't`,
        `ngl the ${g.weather?.name || 'conditions'} today completely changed the game. ${g.home} can't play in these conditions. I said this before kickoff. My mates said I was wrong. I was not wrong.`,
        `every time I look at the league table it looks different to how it looked twenty seconds ago. sent a screenshot to my brother and he said the numbers were different in his version. anyway ${myTeam || 'the lads'} played okay`,
        `${potm ? potm + ' had a worldie today, genuinely' : 'no standout performer today, they were all a bit whatever'}, can't believe ${loser || g.away} thought this was the game to try pressing high up the pitch`
      ]);
    },

    ultra: (g, state) => {
      const myTeam = getUltraTeam(state, g);
      const enemy = myTeam === g.home ? g.away : g.home;
      const myScore = myTeam === g.home ? g.homeScore : g.awayScore;
      const theirScore = myTeam === g.home ? g.awayScore : g.homeScore;
      const won = myScore > theirScore;
      const drew = myScore === theirScore;
      return rnd([
        won
          ? `WE GO AGAIN. ${myTeam?.toUpperCase() || g.home.toUpperCase()} NEVER SLEEP. ${enemy} came here and they left with nothing and they can count themselves lucky they left at all.`
          : drew
          ? `A point. A point. They will give us a point. Do you think a point is what we came here for. Do you think the lads in Block D queued for five hours to accept a POINT.`
          : `I have been supporting ${myTeam || g.home} for twenty-three years and I have never once felt good about it and I never will and I will never stop. ${enemy} can rot.`,
        `Ultra Sec 4 will be at every away fixture this season regardless of the dimensional irregularities that made last month's trip impossible to explain. We travel. We always travel. The transport simply reorganizes itself around us.`,
        `${enemy} fans have been talking all week. ALL WEEK. You've seen the forum. And now look at the table. Look at the table. Some of us have been saying this for years. THE TABLE KNOWS.`,
        `CAPO NOTICE: The singing in the North End during the second half was noted by the Bureau of Sound Events and formally described as "acoustically anomalous." We take this as a compliment. Ultra Sec 4 will sing louder next time.`
      ]);
    },

    prophet: (g, state) => {
      const potm = g.potm;
      const winner = g.homeScore > g.awayScore ? g.home : g.homeScore < g.awayScore ? g.away : null;
      return rnd([
        `${g.home} will be remembered. Not for the result. For what was underneath the result.`,
        `${potm || 'Someone'} on that pitch today carries something they don't know about yet. It will become clear in the later rounds.`,
        `The score was ${g.homeScore}–${g.awayScore}. This is one of the numbers. There are others.`,
        winner ? `${winner} wins. The ground receives. The season continues to narrow.` : `Neither side wins. The draw is not neutral. The draw never is.`,
        `Pay attention to what the ${g.weather?.name || 'weather'} does to the ball. Pay attention to the ball. The ball is trying to show you something.`,
        `Round ${g.round}. We are closer now than we were. You can feel it if you stand near the pitch after the crowd has gone.`,
        `${g.away} came a long way today. Distances in this league are not always geographical.`
      ]);
    },

    drone: (g, state) => {
      const total = g.homeScore + g.awayScore;
      const potm = g.potm;
      const players = getAllPlayers(state);
      const randomPlayer = players[Math.floor(seededRandom(g.home + g.round) * players.length)];
      return rnd([
        `DATA LOG R${g.round}: ${g.home} ${g.homeScore}–${g.awayScore} ${g.away}. Total goals: ${total}. Weather variable: ${g.weather?.name || 'NULL'}. I have flagged this match for review. I am not sure why I am flagging things anymore.`,
        `${potm ? 'POTM: ' + potm + '. Registering anomalous performance signature. This player has appeared in the data more frequently than projected. I am noting this. I do not know what to do with this information.' : 'No standout player identified. This is unusual.'}`,
        `Querying historical records for matches played in ${g.weather?.name || 'these conditions'}. ${Math.floor(seededRandom(g.weather?.name || 'x') * 40) + 3} precedents found. ${Math.floor(seededRandom(g.weather?.name + 'result') * 100)}% ended in the same result.`,
        `${randomPlayer ? randomPlayer + ' statistical output this season: irregular. I have attempted to model the trajectory. The model returned an error I have not seen before. Error text: "NOT THAT AGAIN."' : 'Unable to select player for analysis.'}`,
        `End-of-match report filed. ${total === 0 ? 'ZERO GOALS. The models did not predict this. The models do not like this. Something in the projection layer is humming.' : total > 4 ? 'HIGH SCORING. This is a statistical anomaly. I am examining my code but I know what I wrote.'}`
      ]);
    },

    analyst: (g, state) => {
      const manager_home = getManager(state, g.home);
      const margin = Math.abs(g.homeScore - g.awayScore);
      const winner = g.homeScore > g.awayScore ? g.home : g.homeScore < g.awayScore ? g.away : null;
      const loser = winner === g.home ? g.away : winner === g.away ? g.home : null;
      return rnd([
        `the expected goals model I've built doesn't account for ${g.weather?.name || 'these'} conditions and honestly after today I'm not sure it accounts for anything. ${g.home} had the better xG by 0.3 but it didn't matter.`,
        `${manager_home ? manager_home + '\'s tactical setup' : 'The home side\'s shape'} today was technically a 4-3-3 but I've been watching the footage and one of those attackers was definitely playing in another dimension.`,
        `margin of victory: ${margin}. this is ${margin === 0 ? 'fine, draws happen, except in this league they happen in a way that feels like a threat' : margin === 1 ? 'statistically tight. one goal decided it. one goal always decides everything.' : margin + ' goals. decisive by any measure.'}`,
        `been asked to explain why ${loser || g.away} kept losing the second ball in the final third. my answer: the second ball appeared to be autonomous. i have three hours of tape on this. no one will watch it.`,
        `if you look at the heat map from the ${g.home} vs ${g.away} match — and I have looked, for several hours, in the dark — ${winner ? winner + '\'s' : 'the'} movement patterns converge on a point that shouldn't exist spatially. very interesting.`
      ]);
    }
  };

  // ─── HELPER FUNCTIONS ──────────────────────────────────────────────────────

  function rnd(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // Seeded random for stable per-match determinism
  function seededRandom(seed) {
    let h = 0;
    const s = String(seed);
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(31, h) + s.charCodeAt(i) | 0;
    }
    return Math.abs(h % 1000) / 1000;
  }

  function getManager(state, teamName) {
    if (!state.teams) return null;
    const team = state.teams.find(t => t.name === teamName);
    return team?.manager || null;
  }

  function getAllPlayers(state) {
    if (!state.teams) return [];
    return state.teams.flatMap(t => (t.players || []).map(p => p.name)).filter(Boolean);
  }

  // The "fan" account's team — whoever has the most games played (longest-running team)
  function getFanTeam(state) {
    if (!state.teams || state.teams.length === 0) return null;
    return state.teams[0].name;
  }

  // Ultra's team is derived from whichever team in this fixture has a lower standing
  function getUltraTeam(state, game) {
    // Ultras always back the underdog in the fixture, unless they've won
    if (game.homeScore > game.awayScore) return game.home;
    if (game.awayScore > game.homeScore) return game.away;
    return game.home;
  }

  // Generate multiple posts per match from different accounts
  function generatePostsForGame(game, state, gameIndex) {
    const accountKeys = Object.keys(ACCOUNTS);

    // Each game generates 2–3 posts from different accounts
    const numPosts = 2 + (gameIndex % 2); // alternates 2 and 3
    const posts = [];

    // Deterministically pick which accounts post about this game
    // (so the same game always gets the same accounts across renders)
    const seed = game.home.charCodeAt(0) + game.away.charCodeAt(0) + game.round * 7;
    const startIdx = seed % accountKeys.length;

    for (let i = 0; i < numPosts; i++) {
      const accountKey = accountKeys[(startIdx + i) % accountKeys.length];
      const account = ACCOUNTS[accountKey];
      const text = GENERATORS[account.voice](game, state);
      const isReply = i > 0; // first post is a standalone, rest are "replies" indented

      posts.push({ account, text, isReply });
    }

    return posts;
  }

  function generateMetrics(game, isReply) {
    // Surreal-ish numbers. Feast games get elevated engagement.
    const base = game.isFeast ? 400 : 0;
    const comments = Math.floor(seededRandom(game.home + 'c') * 40) + 1;
    const retweets = Math.floor(seededRandom(game.away + 'r') * 300) + base + 14;
    const likes = Math.floor(seededRandom(game.home + game.round + 'l') * 800) + base;
    const soulSuffix = likes < 100 ? ' souls' : likes < 500 ? ' witnesses' : ' believers';
    return { comments, retweets, likes: likes + soulSuffix };
  }

  // ─── RENDER ───────────────────────────────────────────────────────────

  function loadFeed() {
    const feedContainer = document.getElementById('feed');
    const rawData = localStorage.getItem(STORAGE_KEY);

    if (!rawData) {
      feedContainer.innerHTML = '<div class="no-data">The timeline is completely quiet.<br>Run some match simulations first to broadcast signals.</div>';
      return;
    }

    const state = JSON.parse(rawData);
    const games = state.games || [];

    if (games.length === 0) {
      feedContainer.innerHTML = '<div class="no-data">0 transmissions found.<br>Awaiting match reports...</div>';
      return;
    }

    feedContainer.innerHTML = '';

    // Newest matches at the top
    const reversedGames = [...games].reverse();
    let lastRound = null;

    reversedGames.forEach((game, gameIndex) => {
      // Insert a round divider when the round changes
      if (game.round !== lastRound) {
        lastRound = game.round;
        const divider = document.createElement('div');
        divider.className = 'round-divider';
        divider.textContent = `Round ${game.round}`;
        feedContainer.appendChild(divider);
      }

      const posts = generatePostsForGame(game, state, gameIndex);

      posts.forEach((post) => {
        const metrics = generateMetrics(game, post.isReply);

        const tweet = document.createElement('div');
        tweet.className = post.isReply ? 'tweet reply' : 'tweet';

        tweet.innerHTML = `
          <div class="avatar">${post.account.avatar}</div>
          <div class="tweet-content">
            <div class="tweet-header">
              <span class="display-name">${post.account.name}</span>
              <span class="handle">${post.account.handle}</span>
              <span class="timestamp">R${game.round}</span>
            </div>
            <div class="tweet-text">${post.text}</div>
            ${!post.isReply ? `<div class="match-ref">
              <strong>${game.home} ${game.homeScore}–${game.awayScore} ${game.away}</strong>
              &nbsp;·&nbsp;${game.weather?.icon || '🌫️'} ${game.weather?.name || 'Unknown Conditions'}
            </div>` : ''}
            <div class="tweet-actions">
              <div class="action-item">💬 <span>${metrics.comments}</span></div>
              <div class="action-item">🔄 <span>${metrics.retweets}</span></div>
              <div class="action-item">❤️ <span>${metrics.likes}</span></div>
            </div>
          </div>
        `;

        feedContainer.appendChild(tweet);
      });
    });
  }

  window.onload = loadFeed;
</script>
</body>
</html>
